name: Read-only query and dashboard regressions
on:
  push:
    paths:
      - 'scripts/*.py'
      - 'tests/test_*.py'
      - 'examples/**'
      - 'SKILL.md'
      - 'references/**'
      - '.github/workflows/dashboard-evidence.yml'
  pull_request:
    paths:
      - 'scripts/*.py'
      - 'tests/test_*.py'
      - 'examples/**'
      - 'SKILL.md'
      - 'references/**'
      - '.github/workflows/dashboard-evidence.yml'
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Synthetic regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Offline evidence example
        run: python3 examples/dashboard-evidence/offline_demo.py --out "${{ runner.temp }}/dashboard-evidence-demo"
      - name: Offline aggregate example
        run: python3 examples/etl-preview-aggregate/offline_demo.py --out "${{ runner.temp }}/aggregate-demo"
      - name: Offline chunked extraction example
        run: python3 examples/bounded-extract/offline_demo.py --out "${{ runner.temp }}/extract-demo"
      - name: Independent extraction acceptance example
        run: python3 examples/extraction-evidence/offline_demo.py --out "${{ runner.temp }}/extract-acceptance-demo"
