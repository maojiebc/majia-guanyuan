<!DOCTYPE html>
<html lang="zh-CN" class="demo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>门店手机成绩单 · 脱敏离线案例</title>
<meta name="description" content="majia-guanyuan 移动端成绩单样本。虚构门店与虚构数字，双击即可离线点完所有交互。">
<style>
:root{--brand:#FA4616;--brand-deep:#C93A10;--brand-soft:#FFD9C8;--brand-mid:#E8A888;--brand-tint:#FFF1EA;--ink:#1F2328;--muted:#6B7078;--line:#EFE6E0;--paper:#FFFCFA;--card:#FFFFFF;--up:#D0431C;--down:#1F8A5B;--flat:#8A8F96;--warn:#B85C00;--good:#1F8A5B;--alt:#FFD100;--other:#B8B2AD;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.shell{max-width:640px;margin:0 auto;padding:12px 14px 28px}
b,strong,.scoreval,.kpi b,.barval,.peerrank b,.point b,td{font-variant-numeric:tabular-nums}

/* 顶部 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 10px}
.top h1{font-size:21px;line-height:1.3;margin:0;letter-spacing:-.3px}
.top p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.top p.stale{color:var(--warn)}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:14px;color:var(--muted);flex-shrink:0;display:grid;place-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--brand-tint);padding:3px;border-radius:8px;position:sticky;top:0;z-index:5;box-shadow:0 6px 0 var(--paper)}
.seg button{min-height:40px;border-radius:6px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;padding:0 8px}
.seg button.active{background:#fff;color:var(--brand-deep);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sec .seg,.rowhead .seg{position:static;box-shadow:none;display:inline-grid;width:auto}
.sec .seg button,.rowhead .seg button{min-height:34px;font-size:13px;padding:0 10px}

/* 成绩单 */
.score{background:var(--brand);color:#fff;border-radius:12px;padding:16px 16px 14px;margin:12px 0 14px}
.scoretop{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.92}
.score .link{color:#fff;opacity:.9;font-size:13px;min-height:28px}
.scoreval{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.15;margin:6px 0 8px}
.scoreval .cur{font-size:22px;font-weight:600;margin-right:2px;vertical-align:8px}
.scoreval .unit{font-size:15px;font-weight:500;margin-left:6px;letter-spacing:0;opacity:.9}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.score .delta{background:rgba(0,0,0,.22);color:#FFFCFA}
.score .delta small{color:rgba(255,255,255,.85)}
.scoremeta{margin:10px 0 12px;font-size:14px;opacity:.95}
.scoremeta small{opacity:.8;font-size:13px}
.splitbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.22);gap:2px}
.splitbar i{display:block;height:100%;background:#fff}.splitbar i.alt{background:var(--alt)}.splitbar i.other{background:rgba(255,255,255,.55)}
.splitrows{display:grid;grid-template-columns:1fr;gap:2px;margin-top:8px}
.splitrow{display:flex;align-items:center;gap:10px;text-align:left;color:#fff;min-height:40px;width:100%}
.sw{width:8px;height:8px;border-radius:2px;background:#fff;flex-shrink:0}.sw.alt{background:var(--alt)}.sw.other{background:rgba(255,255,255,.55)}
.swname{font-size:14px;line-height:1.3;flex:1;min-width:0}.swname small{display:inline;font-size:13px;opacity:.85;margin-left:6px}
.swval{font-size:15px;font-weight:600;text-align:right;line-height:1.3;display:flex;align-items:baseline;gap:8px}.swval .delta{background:none;padding:0;font-size:13px;color:rgba(255,255,255,.9)}
.verdict{margin:12px 0 0;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);font-size:14px;line-height:1.65}

/* 涨跌 */
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 8px;border-radius:12px;background:#F4F0EC;color:var(--flat);white-space:nowrap}
.delta.up{color:var(--up);background:#FCEAE4}.delta.down{color:var(--down);background:#E6F4EC}.delta.na{font-weight:500}
.delta small{font-weight:400;color:var(--muted);font-size:12px}
.delta.small{padding:0 6px;font-size:12px;background:none}
.score .delta.up,.score .delta.down,.score .delta.flat,.score .delta.na{color:#FFFCFA;background:rgba(0,0,0,.22)}
.score .delta small{color:rgba(255,255,255,.92)}
.score .swval .delta{background:none;padding:0;color:rgba(255,255,255,.92)}

/* 分区 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;margin-bottom:12px}
.sechead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sechead h2{font-size:17px;margin:0;line-height:1.4}
.sub{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.sec h3{font-size:15px;margin:14px 0 4px;font-weight:600}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.rowhead h3{margin:0}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:10px 0 0}
.warn{background:#FFF6DD;color:#8D651F;padding:9px 12px;border-radius:6px;font-size:13px;line-height:1.6;margin:0 0 12px}
.empty{padding:26px 14px;text-align:center;background:#FFFAF6;border-radius:8px;color:var(--muted);font-size:14px;line-height:1.7}
.link{color:var(--brand-deep);font-size:13px;font-weight:600;min-height:32px}
.toggle{display:block;width:100%;text-align:left;color:var(--brand-deep);font-size:13px;font-weight:600;min-height:40px;margin-top:4px;border-top:1px dashed var(--line)}

/* 待办 */
.todos{display:grid;gap:6px}
.todo{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:10px 10px 10px 0;border-bottom:1px solid var(--line);min-height:56px}
.todo:last-child{border-bottom:0}.todo.static{cursor:default}
.tdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--flat)}
.todo.warn .tdot{background:var(--warn)}.todo.good .tdot{background:var(--good)}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tbody b{font-size:15px;line-height:1.4}.tbody span{font-size:13px;color:var(--muted);line-height:1.6}
.tbody em{font-style:normal;color:var(--ink);font-weight:500}
.chev{color:var(--muted);font-size:18px;line-height:1.2}

/* 图表 */
.chart{width:100%;margin:4px 0 0}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{font-size:11px;fill:var(--muted)}.chart .grid{stroke:#F1ECE7;stroke-width:1}
.chart .mainline{stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .avgline{stroke:#9AA3AD;stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.chart .satdot{fill:#fff;stroke:var(--brand);stroke-width:1.4}
.chart .cursor{stroke:var(--brand-soft);stroke-dasharray:3 3}.chart .seldot{fill:var(--brand);stroke:#fff;stroke-width:2}
.chart .bar{fill:var(--brand-soft)}.chart .bar.cur{fill:var(--brand)}.chart .bar.partial{opacity:.75}
.chart .val{font-size:11px;fill:var(--ink);font-weight:600}
.range{width:100%;accent-color:var(--brand);min-height:32px;margin:0}
.point{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;background:var(--brand-tint);font-size:13px;margin-top:4px;flex-wrap:wrap}
.point b{font-size:15px}.point b small{font-weight:400;color:var(--muted);font-size:13px}
.point small{color:var(--muted)}.pointcmp{margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.sw.main{background:var(--brand);width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.sw.avg{background:repeating-linear-gradient(90deg,#9AA3AD 0 4px,transparent 4px 7px);width:14px;height:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.sw.sat{background:#fff;border:1.5px solid var(--brand);border-radius:50%;width:8px;height:8px;display:inline-block;margin-right:4px;vertical-align:middle}

/* 条形排名 */
.bars{display:grid;gap:10px;margin-top:6px}
.barline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.barlabel{font-size:14px;display:flex;align-items:baseline;gap:6px;min-width:0;overflow-wrap:anywhere}
.rk{font-size:13px;color:var(--muted);width:16px;flex-shrink:0}
.barval{font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.barval small{font-weight:400;color:var(--muted);font-size:13px}
.track{height:6px;background:#F5EFEA;border-radius:3px;overflow:hidden}.track i{display:block;height:100%;background:var(--brand-mid);border-radius:3px}
.barrow:first-child .track i{background:var(--brand)}

/* 同行 */
.peers{display:grid;gap:8px}
.peer{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:#FFFDFB}
.peerhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.peername{font-size:15px;font-weight:600}.peername small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.peerrank{text-align:right}.peerrank b{font-size:21px;color:var(--brand-deep);display:block;line-height:1.2}.peerrank small{font-size:13px;color:var(--muted)}
.cmpbars{display:grid;gap:6px;margin-top:10px}
.cmprow{display:grid;grid-template-columns:44px 1fr 80px;align-items:center;gap:8px;font-size:13px}
.cmprow span{color:var(--muted)}.cmprow b{text-align:right;font-size:13px}
.cmprow .track.me i{background:var(--brand)}

/* KPI 网格 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.kpi{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FFFDFB;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi>span{font-size:13px;color:var(--muted);line-height:1.4}.kpi>span small{display:block;font-size:12px;opacity:.9}
.kpi b{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.3}.kpi b small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .delta{align-self:flex-start;margin-top:2px}.kpisub{font-size:13px;color:var(--muted)}
.badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;background:var(--brand-tint);color:var(--muted);font-size:12px;font-weight:600;vertical-align:middle}
.health{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:#FFFDFB}
.health div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.health span{color:var(--muted)}.health b{font-size:15px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.vscol{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FFFDFB}
.vscol span{display:block;font-size:13px;font-weight:600}
.vscol b{display:block;font-size:22px;margin:4px 0 0;letter-spacing:-.5px}
.vscol b small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.vscol em{display:block;font-style:normal;font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
.vscol .subn{display:block;font-size:16px;margin-top:0}
.vsrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:8px}
.vsrow .side{text-align:right}
.vsrow .side strong{display:block;font-size:14px;font-weight:600;color:var(--muted)}

/* 页脚 / 弹层 */
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:4px 2px 8px;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(31,35,40,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:8px}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:14px 14px 10px 10px;padding:18px 16px 16px;box-shadow:0 8px 40px rgba(31,35,40,.18)}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}.sheet h2{font-size:18px;margin:0}
.sheet h4{font-size:15px;margin:14px 0 4px}
.sheetbody p{font-size:14px;line-height:1.8;margin:10px 0;color:#4A5058}.sheetbody p b{color:var(--ink)}
.sheet table{width:100%;font-size:13px;border-collapse:collapse;table-layout:fixed;margin-top:6px}
.sheet th,.sheet td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.sheet th:first-child,.sheet td:first-child{text-align:left}.sheet th{font-weight:500;color:var(--muted)}
.sheet table.daily td:first-child{white-space:pre-line;line-height:1.35}
.sheet table.daily tr.wkend td{background:#FFF4E6}
.sheet .close{background:var(--brand);color:#fff;border-radius:8px;min-height:44px;width:100%;margin-top:14px;font-weight:600}

/* 加载 */
.loading{height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.loading h2{font-size:17px;margin:14px 0 4px}.loading p{font-size:13px;color:var(--muted);margin:0}
.pulse{width:26px;height:26px;border:2px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

@media(min-width:560px){.shell{padding:16px 20px 32px}.scoreval{font-size:44px}}
@media(max-width:360px){.shell{padding:10px 10px 24px}.scoreval{font-size:34px}.seg button{font-size:13px;padding:0 4px}.top h1{font-size:19px}}

/* 离线单页：外层可滚，手机宽画框 */
html.demo,html.demo body{overflow:auto;height:auto;background:#D8D2CB}
.demo-banner{position:sticky;top:0;z-index:20;background:#1F2328;color:#F4F0EC;font-size:13px;line-height:1.5;padding:8px 14px;text-align:center}
.demo-wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 0 1px #c9c2ba}
html.demo #app{height:auto;min-height:100vh;overflow:visible}
.storeseg{margin:0 0 8px}

</style>
</head>

    var acMe = divide(me.rev, me.orders), acMed = median(members.map(function (x) { return divide(x.rev, x.orders); }).filter(function (x) { return x != null; }));
    var ordMed = median(members.map(function (x) { return x.orders / x.days; }));
    modal('跟' + labels[key] + '比', '<p>近 7 天（' + md(addDays(ANCHOR, -6)) + ' – ' + md(ANCHOR) + '）日均营业额排第 ' + fmt(rank) + '。</p>' +
      table(['', '本店', '中位', '前 25%'], [['日均营业额', '¥' + fmt(me.avg), '¥' + fmt(quantile(avgs, 0.5)), '¥' + fmt(quantile(avgs, 0.75))], ['日均订单', fmt(me.orders / me.days, 0), fmt(ordMed, 0), '—'], ['客单价', '¥' + fmt(acMe, 1), '¥' + fmt(acMed, 1), '—']]) +
      '<p class="note">"前 25%"是同组里排在前四分之一位置的日均营业额。不显示其他门店名称，也不显示这组有多少家店。</p>');
  }
  /* ---------- 渲染 ---------- */
  function header() {
    var today = (window.SCORECARD_FIXTURE && window.SCORECARD_FIXTURE.today) || dstr(new Date());
    var yesterday = addDays(today, -1), fresh = ANCHOR === yesterday;
    var sub = fresh ? '数据到昨天 ' + md(ANCHOR) + ' ' + wd(ANCHOR) : '数据到 ' + md(ANCHOR) + ' ' + wd(ANCHOR) + '，昨天的还没同步';
    var storeBar = '';
    if (window.SCORECARD_FIXTURE) {
      storeBar = '<div class="seg storeseg" role="tablist">' + window.SCORECARD_FIXTURE.storeNames.map(function (n) {
        return '<button type="button" role="tab" data-set="demoStore" data-value="' + esc(n) + '" class="' + (S.demoStore === n ? 'active' : '') + '">' + esc(n) + '</button>';
      }).join('') + '</div>';
    }
    return '<header class="top"><div><h1>' + esc(STORE || '所选门店') + '</h1><p class="' + (fresh ? 'fresh' : 'stale') + '">' + esc(sub) + '</p></div><button class="iconbtn" data-action="methods" aria-label="口径说明">i</button></header>' + storeBar + seg('period', ['昨天', '近7天', '近30天', '本月'], S.period);
  }
  function render() {
    var scroll = A.scrollTop;
    if (!ANCHOR) { A.innerHTML = '<main class="shell"><header class="top"><div><h1>' + esc(STORE || '所选门店') + '</h1><p class="stale">近 70 天没有财务数据</p></div></header>' + empty((STORE || '所选门店') + '近 70 天没有营业数据。可换一家门店，或等财务表同步后再看。') + '</main>'; return; }
    var truncated = D.some(function (r, i) { return r.length >= viewLimit(i); });
    A.innerHTML = '<main class="shell">' + header() + (truncated ? '<div class="warn">部分数据达到取数上限，个别数字可能不完整。</div>' : '') +
      scorecard() + trend() + peer() + channels() + customers() + memberVs() + privateDomain() + coupons() + hours() + products() +
      '<footer class="foot"><span>财务数据同步于 ' + esc(SYNC ? SYNC.slice(0, 16) : '—') + ' · 读取 ' + esc(S.lastRead || '—') + '</span><button class="link" data-action="methods">口径说明</button></footer></main>';
    A.scrollTop = scroll;
  }
  A.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.set) {
      S[b.dataset.set] = b.dataset.value;
      if (b.dataset.set === 'demoStore' && window.SCORECARD_FIXTURE) { applyDemoStore(S.demoStore); return; }
      if (b.dataset.set === 'grain') S.point = null;
      render();
      return;
    }
    if (b.dataset.toggle) { S.open[b.dataset.toggle] = !S.open[b.dataset.toggle]; render(); return; }
    var a = b.dataset.action;
    if (a === 'methods') modal('这些数字怎么来的', methods());
    if (a === 'daily') dailySheet();
    if (a === 'way') waySheet(b.dataset.value);
    if (a === 'peer') peerSheet(b.dataset.value);
  });
  A.addEventListener('input', function (e) {
    if (e.target.id === 'trend-range') {
      S.point = Number(e.target.value);
      var holder = e.target.closest('.sec'), tmp = document.createElement('div'); tmp.innerHTML = lineChart(currentPoints);
      holder.querySelector('.chart').replaceWith(tmp.querySelector('.chart')); holder.querySelector('.point').replaceWith(tmp.querySelector('.point'));
    }
  });
  function receive(data) {
    if (!Array.isArray(data)) { A.innerHTML = empty('数据尚未就绪，请刷新页面后重试'); return; }
    V = detectV(data);
    D = data.map(rows); S.lastRead = new Date().toLocaleString('zh-CN', { hour12: false }); S.point = null;
    try { buildFinance(); render(); } catch (err) { A.innerHTML = empty('渲染暂未完成，请刷新页面重试'); console.error('owner dashboard render failed', err); }
  }
  window.__OWNER = { receive: receive, getData: function () { return D; }, views: function () { return V; }, state: S, agg: agg, periods: function () { return PERIODS; } };
  function applyDemoStore(name) {
    var pack = window.SCORECARD_FIXTURE && window.SCORECARD_FIXTURE.stores[name];
    if (!pack) { A.innerHTML = empty('演示数据缺失'); return; }
    S.demoStore = name;
    receive(pack.views);
  }
  if (window.SCORECARD_FIXTURE) {
    applyDemoStore(window.SCORECARD_FIXTURE.storeNames[0]);
  } else if (typeof GDPlugin === 'function') {
    new GDPlugin().init(receive);
  } else {
    A.innerHTML = empty('没有数据源：离线打开请用生成后的 HTML，或在观远页里由 GDPlugin 注入');
  }
})();

</script>
</body>
</html>
