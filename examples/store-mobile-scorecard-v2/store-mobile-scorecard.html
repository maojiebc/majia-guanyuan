<!DOCTYPE html>
<html lang="zh-CN" class="demo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>门店手机成绩单 · 脱敏离线案例</title>
<meta name="description" content="majia-guanyuan 移动端成绩单样本。虚构门店与虚构数字，双击即可离线点完所有交互。">
<style>
:root{--text-meta:13px;--text-support:14px;--text-body:15px;--text-label:16px;--text-section:18px;--text-title:22px;--text-kpi:24px;--space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--brand:#FA4616;--brand-deep:#C93A10;--brand-soft:#FFD9C8;--brand-mid:#E8A888;--brand-tint:#FFF1EA;--ink:#1F2328;--muted:#6B7078;--line:#EFE6E0;--paper:#FFFCFA;--card:#FFFFFF;--up:#D0431C;--down:#1F8A5B;--flat:#8A8F96;--warn:#B85C00;--good:#1F8A5B;--alt:#FFD100;--other:#B8B2AD;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none;font-size:var(--text-body);line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{height:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.shell{max-width:640px;margin:0 auto;padding:12px 14px 28px}
b,strong,.scoreval,.kpi b,.barval,.peerrank b,.point b,td{font-variant-numeric:tabular-nums}

/* 顶部 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:2px 0 10px}
.top h1{font-size:var(--text-title);line-height:1.3;margin:0;letter-spacing:-.3px}
.top p{margin:4px 0 0;font-size:var(--text-support);color:var(--muted)}
.top p.stale{color:var(--warn)}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:var(--text-body);color:var(--muted);flex-shrink:0;display:grid;place-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--brand-tint);padding:3px;border-radius:8px;position:sticky;top:0;z-index:5;box-shadow:0 6px 0 var(--paper)}
.seg button{min-height:44px;border-radius:6px;font-size:var(--text-body);font-weight:600;color:var(--muted);white-space:nowrap;padding:0 8px}
.seg button.active{background:#fff;color:var(--brand-deep);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sec .seg,.rowhead .seg{position:static;box-shadow:none;display:inline-grid;width:auto}
.sec .seg button,.rowhead .seg button{min-height:44px;font-size:var(--text-support);padding:0 10px}

/* 成绩单 */
.score{background:var(--brand);color:#fff;border-radius:12px;padding:16px 16px 14px;margin:12px 0 14px}
.scoretop{display:flex;justify-content:space-between;align-items:center;font-size:var(--text-support);opacity:.92}
.score .link{color:#fff;opacity:.9;font-size:var(--text-support);min-height:44px}
.scoreval{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.15;margin:6px 0 8px}
.scoreval .cur{font-size:var(--text-kpi);font-weight:600;margin-right:2px;vertical-align:8px}
.scoreval .unit{font-size:var(--text-label);font-weight:500;margin-left:6px;letter-spacing:0;opacity:.9}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.score .delta{background:rgba(0,0,0,.22);color:#FFFCFA}
.score .delta small{color:rgba(255,255,255,.85)}
.scoremeta{margin:10px 0 12px;font-size:var(--text-body);opacity:.95}
.scoremeta small{opacity:.8;font-size:var(--text-support)}
.splitbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.22);gap:2px}
.splitbar i{display:block;height:100%;background:#fff}.splitbar i.alt{background:var(--alt)}.splitbar i.other{background:rgba(255,255,255,.55)}
.splitrows{display:grid;grid-template-columns:1fr;gap:2px;margin-top:8px}
.splitrow{display:flex;align-items:center;gap:10px;text-align:left;color:#fff;min-height:44px;width:100%}
.sw{width:8px;height:8px;border-radius:2px;background:#fff;flex-shrink:0}.sw.alt{background:var(--alt)}.sw.other{background:rgba(255,255,255,.55)}
.swname{font-size:var(--text-body);line-height:1.3;flex:1;min-width:0}.swname small{display:inline;font-size:var(--text-support);opacity:.85;margin-left:6px}
.swval{font-size:var(--text-label);font-weight:600;text-align:right;line-height:1.3;display:flex;align-items:baseline;gap:8px}.swval .delta{background:none;padding:0;font-size:var(--text-support);color:rgba(255,255,255,.9)}
.verdict{margin:12px 0 0;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);font-size:var(--text-body);line-height:1.65}

/* 涨跌 */
.delta{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-support);font-weight:600;padding:3px 8px;border-radius:12px;background:#F4F0EC;color:var(--flat);white-space:nowrap}
.delta.up{color:var(--up);background:#FCEAE4}.delta.down{color:var(--down);background:#E6F4EC}.delta.na{font-weight:500}
.delta small{font-weight:400;color:var(--muted);font-size:var(--text-meta)}
.delta.small{padding:0 4px;font-size:var(--text-meta);background:none}
.score .delta.up,.score .delta.down,.score .delta.flat,.score .delta.na{color:#FFFCFA;background:rgba(0,0,0,.22)}
.score .delta small{color:rgba(255,255,255,.92)}
.score .swval .delta{background:none;padding:0;color:rgba(255,255,255,.92)}

/* 分区 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 14px;margin-bottom:16px}
.sechead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sechead h2{font-size:var(--text-section);margin:0;line-height:1.4}
.sub{margin:4px 0 0;font-size:var(--text-support);color:var(--muted);line-height:1.6}
.sec h3{font-size:var(--text-label);margin:14px 0 4px;font-weight:600}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}.rowhead h3{margin:0}
.note{font-size:var(--text-support);color:var(--muted);line-height:1.7;margin:10px 0 0}
.warn{background:#FFF6DD;color:#8D651F;padding:9px 12px;border-radius:6px;font-size:var(--text-support);line-height:1.6;margin:0 0 12px}
.data-warning{background:#FFF6E5;color:#795218;border:1px solid #F0D6AA;border-left:3px solid #CC8B2A;border-radius:8px;padding:12px;margin:12px 0;font-size:var(--text-support);line-height:1.7;overflow-wrap:anywhere}
.data-warning>b{display:block;font-size:var(--text-body);line-height:1.5;color:var(--up)}
.data-warning p{margin:6px 0 0}
.data-warning .link{color:#795218;display:block;margin-top:4px;text-align:left}
.empty{padding:26px 14px;text-align:center;background:#FFFAF6;border-radius:8px;color:var(--muted);font-size:var(--text-body);line-height:1.7}
.link{color:var(--brand-deep);font-size:var(--text-support);font-weight:600;min-height:44px}
.toggle{display:block;width:100%;text-align:left;color:var(--brand-deep);font-size:var(--text-support);font-weight:600;min-height:44px;margin-top:4px;border-top:1px dashed var(--line)}

/* 待办 */
.todos{display:grid;gap:6px}
.todo{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:10px 10px 10px 0;border-bottom:1px solid var(--line);min-height:56px}
.todo:last-child{border-bottom:0}.todo.static{cursor:default}
.tdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--flat)}
.todo.warn .tdot{background:var(--warn)}.todo.good .tdot{background:var(--good)}
.tbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tbody b{font-size:var(--text-label);line-height:1.4}.tbody span{font-size:var(--text-support);color:var(--muted);line-height:1.6}
.tbody em{font-style:normal;color:var(--ink);font-weight:500}
.chev{color:var(--muted);font-size:var(--text-section);line-height:1.2}

/* 图表 */
.chart{width:100%;margin:4px 0 0}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{font-size:15px;fill:var(--muted)}.chart .grid{stroke:#F1ECE7;stroke-width:1}
.chart .mainline{stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .avgline{stroke:#9AA3AD;stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.chart .satdot{fill:#fff;stroke:var(--brand);stroke-width:1.4}
.chart .cursor{stroke:var(--brand-soft);stroke-dasharray:3 3}.chart .seldot{fill:var(--brand);stroke:#fff;stroke-width:2}
.chart .bar{fill:var(--brand-soft)}.chart .bar.cur{fill:var(--brand)}.chart .bar.partial{opacity:.75}
.chart .val{font-size:15px;fill:var(--ink);font-weight:600}
#sec-trend .sechead{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px}
#sec-trend .sechead>div:first-child{display:contents}
#sec-trend .sechead h2{grid-column:1;grid-row:1}
#sec-trend .sechead .seg{grid-column:2;grid-row:1}
#sec-trend .sechead .sub{grid-column:1 / -1;grid-row:2;margin:0}
.range{width:100%;accent-color:var(--brand);min-height:44px;margin:0}
.point{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;background:var(--brand-tint);font-size:var(--text-support);margin-top:4px;flex-wrap:wrap}
.point b{font-size:var(--text-label)}.point b small{font-weight:400;color:var(--muted);font-size:var(--text-support)}
.point small{color:var(--muted)}.pointcmp{margin-left:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:var(--text-support);color:var(--muted);margin-top:8px}
.sw.main{background:var(--brand);width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.sw.avg{background:repeating-linear-gradient(90deg,#9AA3AD 0 4px,transparent 4px 7px);width:14px;height:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.sw.sat{background:#fff;border:1.5px solid var(--brand);border-radius:50%;width:8px;height:8px;display:inline-block;margin-right:4px;vertical-align:middle}

/* 条形排名 */
.bars{display:grid;gap:12px;margin-top:8px}
.barline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.barlabel{font-size:var(--text-body);display:flex;align-items:baseline;gap:6px;min-width:0;overflow-wrap:anywhere}
.rk{font-size:var(--text-support);color:var(--muted);width:16px;flex-shrink:0}
.barval{font-size:var(--text-body);font-weight:600;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.barval small{font-weight:400;color:var(--muted);font-size:var(--text-support)}
.track{height:6px;background:#F5EFEA;border-radius:3px;overflow:hidden}.track i{display:block;height:100%;background:var(--brand-mid);border-radius:3px}
.barrow:first-child .track i{background:var(--brand)}

/* 同行 */
.peers{display:grid;gap:8px}
.peer{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:#FFFDFB}
.peerhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.peername{font-size:var(--text-label);font-weight:600}.peername small{display:block;font-weight:400;line-height:1.5;font-size:var(--text-support);color:var(--muted);margin-top:2px}
.peerrank{text-align:right}.peerrank b{font-size:var(--text-title);color:var(--brand-deep);display:block;line-height:1.2}.peerrank small{font-size:var(--text-support);color:var(--muted)}
.cmpbars{display:grid;gap:6px;margin-top:10px}
.cmprow{display:grid;grid-template-columns:44px minmax(0,1fr) 84px;align-items:center;gap:8px;font-size:var(--text-support)}
.cmprow span{color:var(--muted)}.cmprow b{text-align:right;font-size:var(--text-support)}
.cmprow .track.me i{background:var(--brand)}

/* KPI 网格 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.kpi{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FFFDFB;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi>span{font-size:var(--text-body);color:var(--ink);font-weight:500;line-height:1.5}.kpi>span small{display:block;font-size:var(--text-support);font-weight:400;color:var(--muted);line-height:1.5;margin-top:4px}
.kpi b{font-size:var(--text-kpi);font-weight:700;letter-spacing:-.5px;line-height:1.3}.kpi b small{font-size:var(--text-support);font-weight:400;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .delta{align-self:flex-start;margin-top:4px;max-width:100%;white-space:normal;flex-wrap:wrap;row-gap:0}.kpisub{font-size:var(--text-support);color:var(--muted)}
.badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;background:var(--brand-tint);color:var(--muted);font-size:var(--text-meta);font-weight:600;vertical-align:middle}
.health{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:#FFFDFB}
.health div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--text-support)}
.health span{color:var(--muted)}.health b{font-size:var(--text-label)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.vscol{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FFFDFB}
.vscol span{display:block;font-size:var(--text-support);font-weight:600}
.vscol b{display:block;font-size:var(--text-kpi);margin:4px 0 0;letter-spacing:-.5px}
.vscol b small{font-size:var(--text-support);font-weight:400;color:var(--muted);margin-left:3px}
.vscol em{display:block;font-style:normal;font-size:var(--text-support);color:var(--muted);line-height:1.5;margin-top:2px}
.vscol .subn{display:block;font-size:var(--text-label);margin-top:0}
.vsrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:8px}
.vsrow .side{text-align:right}
.vsrow .side strong{display:block;font-size:var(--text-body);font-weight:600;color:var(--muted)}

/* 页脚 / 弹层 */
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:var(--text-meta);color:var(--muted);padding:4px 2px 8px;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(31,35,40,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:8px}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:14px 14px 10px 10px;padding:18px 16px 16px;box-shadow:0 8px 40px rgba(31,35,40,.18)}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}.sheet h2{font-size:var(--text-section);margin:0}
.sheet h4{font-size:var(--text-label);margin:14px 0 4px}
.sheetbody p{font-size:var(--text-body);line-height:1.8;margin:10px 0;color:#4A5058}.sheetbody p b{color:var(--ink)}
.sheet table{width:100%;font-size:var(--text-support);border-collapse:collapse;table-layout:fixed;margin-top:6px}
.sheet th,.sheet td{padding:9px 4px;text-align:right;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.sheet th:first-child,.sheet td:first-child{text-align:left}.sheet th{font-weight:500;color:var(--muted)}
.sheet table.daily td:first-child{white-space:pre-line;line-height:1.35}
/* Keep a complete date together at narrow mobile widths. */
.sheet table.daily th:nth-child(1),.sheet table.daily td:nth-child(1){width:22%}
.sheet table.daily th:nth-child(2),.sheet table.daily td:nth-child(2){width:25%}
.sheet table.daily th:nth-child(3),.sheet table.daily td:nth-child(3){width:15%}
.sheet table.daily th:nth-child(4),.sheet table.daily td:nth-child(4){width:17%}
.sheet table.daily th:nth-child(5),.sheet table.daily td:nth-child(5){width:21%}
.sheet table.daily tr.wkend td{background:#FFF4E6}
.sheet .close{background:var(--brand);color:#fff;border-radius:8px;min-height:44px;width:100%;margin-top:14px;font-weight:600}

/* 每日明细固定标题、切片及表头，仅数据区域滚动。 */
.sheet.daily-sheet{display:flex;flex-direction:column;max-height:calc(100% - 8px);overflow:hidden;padding:12px 12px 14px}
.daily-sheet .sheethead,.daily-sheet .close{flex-shrink:0}
.daily-sheet .sheetbody{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.daily-sheet p.daily-period{flex-shrink:0;font-size:var(--text-support);line-height:1.5;margin:2px 0 12px;color:var(--muted)}
.daily-sheet .daily-tabs{position:static;box-shadow:none;flex-shrink:0;margin:0 0 12px}
.daily-summary{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-shrink:0;padding:0 2px}
.daily-summary>div:first-child{display:flex;flex-direction:column;gap:2px}
.daily-summary span{font-size:var(--text-support);color:var(--muted)}
.daily-summary b{font-size:var(--text-kpi);line-height:1.3;font-variant-numeric:tabular-nums}
.daily-summary-meta{text-align:right;font-size:var(--text-support);line-height:1.6;color:var(--muted)}
.daily-sheet p.daily-hint{flex-shrink:0;font-size:var(--text-meta);line-height:1.5;margin:10px 0 8px;color:var(--muted)}
.daily-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
.daily-scroll:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.daily-sheet table.daily{margin:0;border-collapse:separate;border-spacing:0}
.daily-sheet table.daily th{position:sticky;top:0;z-index:1;background:#FFF4ED;color:var(--ink);font-weight:600;white-space:nowrap;box-shadow:0 1px 0 var(--line)}
.daily-sheet table.daily td{font-size:var(--text-support);line-height:1.5}
.daily-sheet table.daily td:not(:first-child){overflow-wrap:normal;white-space:nowrap}
.daily-sheet table.daily th:nth-child(1),.daily-sheet table.daily td:nth-child(1){width:23%}
.daily-sheet table.daily th:nth-child(2),.daily-sheet table.daily td:nth-child(2){width:24%}
.daily-sheet table.daily th:nth-child(3),.daily-sheet table.daily td:nth-child(3){width:15%}
.daily-sheet table.daily th:nth-child(4),.daily-sheet table.daily td:nth-child(4){width:17%}
.daily-sheet table.daily th:nth-child(5),.daily-sheet table.daily td:nth-child(5){width:21%}

/* 加载 */
.loading{height:100%;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.loading h2{font-size:var(--text-section);margin:14px 0 4px}.loading p{font-size:var(--text-support);color:var(--muted);margin:0}
.pulse{width:26px;height:26px;border:2px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

@media(min-width:560px){.shell{padding:16px 20px 32px}.scoreval{font-size:44px}}
@media(max-width:360px){.shell{padding:10px 10px 24px}.scoreval{font-size:34px}.seg button{font-size:var(--text-support);padding:0 4px}.top h1{font-size:var(--text-title)}}

/* 会员门店对比沿用现有比较卡片，仅补充摘要与差距 */
.member-peer-summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 14px}
.member-peer-summary>div{display:flex;flex-direction:column;gap:4px}
.member-peer-summary>div>span{font-size:var(--text-support);color:var(--muted)}
.member-peer-summary b{font-size:var(--text-kpi);line-height:1.3;color:var(--brand-deep)}
.member-peer-summary .delta{max-width:100%;white-space:normal;flex-wrap:wrap}
.member-peer-card .peername{min-width:0;overflow-wrap:anywhere}
.member-peer-card .peerrank{flex-shrink:0}
.member-peer-gap{font-size:var(--text-support);line-height:1.6;margin:10px 0 0;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.member-peer-status{font-size:var(--text-support);line-height:1.6;margin:8px 0;color:var(--muted)}

/* 转化明细沿用每日明细的固定标题、切片及滚动表格。 */
.coupon-sheet .coupon-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
.coupon-sheet p.coupon-value-line{flex-shrink:0;font-size:var(--text-support);line-height:1.6;margin:8px 2px 0;color:var(--ink)}

.coupon-sheet .coupon-methods p{font-size:var(--text-meta);line-height:1.7;margin:8px 0}
.coupon-methods summary{min-height:44px;display:flex;align-items:center;color:var(--brand);font-size:var(--text-support);cursor:pointer}
.coupon-methods summary:after{content:' ›';margin-left:4px}

        '<div class="cmpbars"><div class="cmprow"><span>本店</span><div class="track me"><i style="width:' + (me.avg / top * 100).toFixed(1) + '%"></i></div><b>¥' + fmt(me.avg) + '</b></div><div class="cmprow"><span>中位</span><div class="track"><i style="width:' + (med / top * 100).toFixed(1) + '%"></i></div><b>¥' + fmt(med) + '</b></div></div></button>';

  /* ---------- 生意从哪来：渠道 / 时段 ---------- */

  }

  /* ---------- 顾客 ---------- */

  function periodMembers() {

  }

      '<div class="kpi"><span>到店人次<small>' + esc(p.short) + ' · 每日累加</small></span><b>' + fmt(cur.total) + '</b>' + delta(cur.total, cmp.total, p.cmpLabel, { small: true }) + '</div></div>';
    return section('customers', '顾客与会员', '消费会员是所选周期内卡号去重；到店人次是每日累加',

      '<h3>近期堂食的顾客 <span class="badge">当前快照</span></h3><p class="sub">按最后一单在本店，不随上面的周期变</p>' + bars(status, { max: 6 }));

  function pickMember(rs, names) {

  }
  function memberFreq(r) { return num(r['消费频次']) != null ? num(r['消费频次']) : divide(r['订单数'], r['消费人数']); }
  function memberAnomalyData() {

    return d;
  }
  function memberAnomalyWarning() {
    var d = memberAnomalyData(); if (!d) return '';
    var evidence = '同一会员有 ' + fmt(d.orders) + ' 笔高额POS订单，分布在 ' + fmt(d.days) + ' 天';
    if (num(d.unit) != null && d.unit > 0) evidence += '，每笔均为 ¥' + fmt(d.unit);
    evidence += '，占会员金额 ' + pct(d.share, 0) + '。';
    var detail = (d.product && d.product !== '多项商品' ? '记录商品：' + d.product + '；' : '') + '支付记录：' + (d.payment || '未标记') + '。';
    return '<div class="data-warning" role="note" data-warning="member"><b>会员指标可能被异常订单拉高</b><p>' + esc(evidence) + '</p><p>' + esc(detail) + '建议核查原始小票与支付流水。</p><button class="link" data-action="member-anomaly">查看判断依据 ›</button></div>';

  function memberVs() {
    var rs = D[V.membase] || [];

    var oM = num(mem['订单数']), oN = num(non['订单数']);
    var aovM = divide(revM, oM), aovN = divide(revN, oN);
    var spendM = divide(revM, nM), spendN = divide(revN, nN);
    var tot = (revM || 0) + (revN || 0);

    }

  /* ---------- 口径说明 ---------- */
  function methods() {

  }
  function memberPeerMethods() {
    var r = CTX || {}, start = date(r['会员对比开始日']), end = date(r['会员对比截止日']);
    return '<p><b>比较什么</b>：会员订单数 ÷ 可识别顾客的POS订单数。沿用上方“顾客与会员”的新老客表口径，只含已完成订单，不含外卖。它反映会员交易渗透，不等于复购率。</p>' +
      '<p><b>比较哪段时间</b>：固定近30天' + (start && end ? '（' + md(start) + '–' + md(end) + '）' : '') + '，不随顶部周期切换。所有门店用同一个最新数据截止日；变化值与紧邻的前30天比较。</p>' +
      '<p><b>试看版参评条件</b>：运营中的门店，近30天至少300笔可识别顾客订单，至少21个有订单日期；财务POS有订单的日期不能整天缺少顾客数据。可识别顾客订单须覆盖财务POS订单的80%以上，明显超出财务订单的情况暂不参评。</p>' +
      '<p><b>本店数据</b>：可识别顾客订单 ' + fmt(r['会员对比订单数']) + ' 单，其中会员订单 ' + fmt(r['会员对比会员订单数']) + ' 单；有订单日期 ' + fmt(r['会员对比有效天数']) + ' 天，顾客识别覆盖率 ' + pct(r['会员对比识别覆盖率'], 1) + '。</p>' +
      '<p><b>本店参评状态</b>：' + esc(r['会员对比状态'] || '数据待核对') + '。前30天：' + esc(r['会员对比前期状态'] || '暂无数据') + '；前后两期均具备条件时才显示提升或下降。</p>' +
      '<p><b>名次与中位数</b>：仅在符合条件的同分公司、同地理城市或全国同店型门店中比较。占比相同并列；本店计入中位数。可比样本太少时不排名，不展示其他门店名称和对比组家数。阈值是本次试看规则，后续可按业务反馈调整。</p>';
  }
  function memberPeerSheet(key) {
    var r = CTX || {}, g = memberPeerGroups(r).filter(function (x) { return x.key === key; })[0];
    if (!g) return;
    var value = num(r['会员对比占比']), med = num(r['会员对比' + key + '中位']);
    modal('会员占比 · ' + g.label, '<p>本店排第 <b>' + fmt(r['会员对比' + key + '名次']) + '</b>，' + memberPeerGap(value - med) + '。</p>' +
      table(['指标', '本店', '中位数'], [['会员订单占比', pct(value, 1), pct(med, 1)]]) + memberPeerMethods());
  }

  /* ---------- 渲染 ---------- */
  function header() {
    var today = (window.SCORECARD_FIXTURE && window.SCORECARD_FIXTURE.today) || dstr(new Date()), yesterday = addDays(today, -1), fresh = ANCHOR === yesterday;
    var sub = fresh ? '数据到昨天 ' + md(ANCHOR) + ' ' + wd(ANCHOR) : '数据到 ' + md(ANCHOR) + ' ' + wd(ANCHOR) + '，昨天的还没同步';
    return '<header class="top"><div><h1>' + esc(STORE || '所选门店') + '</h1><p class="' + (fresh ? 'fresh' : 'stale') + '">' + esc(sub) + '</p></div><button class="iconbtn" data-action="methods" aria-label="口径说明">i</button></header>' + seg('period', ['昨天', '近7天', '近30天', '本月'], S.period);
  }
  function render() {
    var scroll = A.scrollTop;
    if (!ANCHOR) { A.innerHTML = '<main class="shell"><header class="top"><div><h1>' + esc(STORE || '所选门店') + '</h1><p class="stale">近 70 天没有财务数据</p></div></header>' + empty((STORE || '所选门店') + '近 70 天没有营业数据。可换一家门店，或等财务表同步后再看。') + '</main>'; return; }
    var truncated = D.some(function (r, i) { return r.length >= viewLimit(i); });
    A.innerHTML = '<main class="shell">' + header() + (truncated ? '<div class="warn">部分数据达到取数上限，个别数字可能不完整。</div>' : '') +
      scorecard() + trend() + peer() + channels() + customers() + memberPeer() + memberVs() + privateDomain() + coupons() + hours() + products() +
      '<footer class="foot"><span>财务数据同步于 ' + esc(SYNC ? SYNC.slice(0, 16) : '—') + ' · 读取 ' + esc(S.lastRead || '—') + '</span><button class="link" data-action="methods">口径说明</button></footer><p class="data-disclaimer">页面数据仅供业务分析使用，精准信息请以财务口径为准，如发现异常数据可联系企业微信【运营支持】排查</p></main>';
    A.scrollTop = scroll;
  }
  A.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.set) { S[b.dataset.set] = b.dataset.value; if (b.dataset.set === 'grain') S.point = null; render(); return; }
    if (b.dataset.toggle) { S.open[b.dataset.toggle] = !S.open[b.dataset.toggle]; render(); return; }
    var a = b.dataset.action;
    if (a === 'methods') modal('这些数字怎么来的', methods());
    if (a === 'daily') dailySheet();
    if (a === 'coupon-detail') couponSheet();
    if (a === 'way') waySheet(b.dataset.value);
    if (a === 'peer') peerSheet(b.dataset.value);
    if (a === 'member-peer') memberPeerSheet(b.dataset.value);
    if (a === 'member-anomaly') memberAnomalySheet();
    if (a === 'member-peer-methods') modal('会员对比参评口径', memberPeerMethods());
  });
  A.addEventListener('input', function (e) {
    if (e.target.id === 'trend-range') {
      S.point = Number(e.target.value);
      var holder = e.target.closest('.sec'), tmp = document.createElement('div'); tmp.innerHTML = lineChart(currentPoints);
      holder.querySelector('.chart').replaceWith(tmp.querySelector('.chart')); holder.querySelector('.point').replaceWith(tmp.querySelector('.point'));
    }
  });
  function receive(data) {
    if (!Array.isArray(data)) { A.innerHTML = empty('数据尚未就绪，请刷新页面后重试'); return; }
    V = detectV(data);
    D = data.map(rows); S.lastRead = new Date().toLocaleString('zh-CN', { hour12: false }); S.point = null;
    try { buildFinance(); render(); } catch (err) { A.innerHTML = empty('渲染暂未完成，请刷新页面重试'); console.error('owner dashboard render failed', err); }
  }
  window.__OWNER = { receive: receive, getData: function () { return D; }, views: function () { return V; }, state: S, agg: agg, periods: function () { return PERIODS; } };
  function applyDemoStore(name) {
    var item = window.SCORECARD_FIXTURE.stores[name]; if (!item) return;
    S.demoStore = name; S.demoBranch = item.branch; S.soupWay = '堂食';
    receive(item.views);
  }
  if (window.SCORECARD_FIXTURE) {
    var f = window.SCORECARD_FIXTURE, branch = document.getElementById('demo-branch'), store = document.getElementById('demo-store');
    branch.innerHTML = Array.from(new Set(Object.values(f.stores).map(function (x) { return x.branch; }))).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
    function selectBranch() {
      var names = Object.keys(f.stores).filter(function (n) { return f.stores[n].branch === branch.value; }).sort(function (a,b) { return f.stores[b].revenue7 - f.stores[a].revenue7 || a.localeCompare(b,'zh-CN'); });
      store.innerHTML = names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
      applyDemoStore(names[0]);
    }
    branch.addEventListener('change',selectBranch);
    store.addEventListener('change',function () { applyDemoStore(store.value); });
    selectBranch();
  } else if (typeof GDPlugin === 'function') {
    new GDPlugin().init(receive);
  } else { A.innerHTML = empty('请打开生成后的离线 HTML 示例'); }
})();

</script>
</body>
</html>
